# ==============================================================================
# tmux Configuration (.tmux.conf) - prefix: Ctrl+b
# ==============================================================================

# 1. 기본 동작
set -g mouse on                      # 마우스로 pane 선택/크기 조절/스크롤
set -g base-index 1                  # 윈도우 번호 1부터
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10               # Neovim ESC 지연 제거
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# 2. 화면 분할: prefix + | (좌우), prefix + - (상하), 현재 경로 유지
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# 3. 설정 리로드
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# 4. 복사 모드 (vi 키) + macOS 클립보드 연동
#    prefix + [ → v 로 선택 → y 로 복사 (pbcopy)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# 5. 플러그인 (TPM) - 최초 1회 prefix + I (대문자) 로 설치
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix + Ctrl-s 저장 / Ctrl-r 복원
set -g @plugin 'tmux-plugins/tmux-continuum'   # 15분마다 자동 저장
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# TPM 초기화 (항상 마지막)
run '~/.tmux/plugins/tpm/tpm'
